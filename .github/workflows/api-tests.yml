  name: API Tests

  on:
    workflow_dispatch:
      inputs:
        scope:
          description: "Test scope to execute"
          required: true
          default: "UnitTest"
          type: choice
          options:
            - UnitTest
            - EmptyEnvironmentTests
            - Reset
            - Cleanup

    push:
      branches:
        - main
        - "feature/**"

    schedule:
      # Run once a month, on the 1st at 02:00 UTC
      - cron: "0 2 1 * *"

  jobs:
    test:
      runs-on: ubuntu-latest

      env:
        TEST_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'UnitTest' }}
        GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
        GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
        GITLAB_ADMIN_USER_ID: ${{ vars.GITLAB_ADMIN_USER_ID }}

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: "17"
            cache: maven

        - name: Run tests
          id: tests
          shell: bash
          run: |
            ./mvnw clean test -Dscope="${TEST_SCOPE}"

        - name: Generate Allure report
          if: always()
          shell: bash
          run: |
            ./mvnw allure:report

        - name: Upload Allure report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: allure-report
            path: target/site
            retention-days: 7
            if-no-files-found: warn

        - name: Upload Surefire reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: surefire-reports
            path: target/surefire-reports
            retention-days: 7
            if-no-files-found: warn

